name: Android Rust Build (Tauri 2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App with Rust Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Run Rust Core Unit Tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Compile Rust Core for Android (ARM64 & x86_64)
        working-directory: src-tauri
        run: |
          cargo ndk -t aarch64-linux-android -t x86_64-linux-android build --release

      - name: Package Android Native Binaries & Artifacts
        run: |
          mkdir -p android-output/arm64 android-output/x86_64
          cp src-tauri/target/aarch64-linux-android/release/*.so android-output/arm64/ 2>/dev/null || true
          cp src-tauri/target/x86_64-linux-android/release/*.so android-output/x86_64/ 2>/dev/null || true
          cp -R dist/ android-output/web-dist/

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TsifraSafe-Android-Rust-Build
          path: android-output/
          retention-days: 14
