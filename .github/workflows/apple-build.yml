name: iPhone Build (iOS .ipa)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: iphone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Native iPhone App Build (.ipa)
  # =========================================================================
  build-iphone:
    name: Build iPhone App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build Xcode iPhone Target (.app)
        run: |
          xcodebuild \
            -project ios/TsifraSafe.xcodeproj \
            -scheme TsifraSafe \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build-output/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package iPhone .ipa File
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find build-output/DerivedData -name "TsifraSafe.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "TsifraSafe.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: TsifraSafe.app not found!"
            exit 1
          fi
          echo "Found compiled iPhone app at: $APP_PATH"
          cp -R "$APP_PATH" build-output/Payload/
          cd build-output
          zip -r -9 TsifraSafe-iPhone.ipa Payload
          echo "Generated iPhone IPA package:"
          ls -lh TsifraSafe-iPhone.ipa

      - name: Upload iPhone .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsifraSafe-iPhone-IPA
          path: build-output/TsifraSafe-iPhone.ipa
          retention-days: 14
