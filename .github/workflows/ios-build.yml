name: iOS Swift Build (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Native Swift iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Xcode iOS App Target (.app)
        run: |
          xcodebuild \
            -project ios/TsifraSafe.xcodeproj \
            -scheme TsifraSafe \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa File
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "TsifraSafe.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: TsifraSafe.app not found in DerivedData!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build-output/Payload/
          cd build-output
          zip -r TsifraSafe.ipa Payload
          echo "Generated IPA:"
          ls -lh TsifraSafe.ipa

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsifraSafe-iOS-IPA
          path: build-output/TsifraSafe.ipa
          retention-days: 14
