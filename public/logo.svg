<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926"/>
      <stop offset="40%" stop-color="#0e0f17"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Outer Rim Specular Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#6ee7b7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Inner Ambient Nebula Glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#7000ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Cipher Electric Gradient -->
    <linearGradient id="cyanElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="coreGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glass Specular Reflection Highlight -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle (Continuous Apple Squircle) -->
  <g filter="url(#iconShadow)">
    <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#chassisGrad)"/>
    <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#nebulaGlow)"/>
    <rect x="32.5" y="32.5" width="447" height="447" rx="107.5" ry="107.5" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>
    
    <!-- Diagonal Glass Refraction Sheen -->
    <path d="M 32 140 C 32 80, 80 32, 140 32 L 372 32 C 220 180, 100 300, 32 400 Z" fill="url(#glassSheen)"/>
  </g>

  <!-- Ambient Light Core -->
  <circle cx="256" cy="256" r="140" fill="url(#nebulaGlow)" filter="url(#softGlow)"/>

  <!-- Precision Rotating Orbital Ticks (BIP-39 & AES Cipher Ring) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round">
    <!-- Orbital Outer Dotted Track -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 9"/>
    <circle cx="256" cy="256" r="126" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Hex / Degree Notch Ticks -->
    <line x1="256" y1="94" x2="256" y2="104" stroke-opacity="0.6" stroke-width="2.5"/>
    <line x1="256" y1="408" x2="256" y2="418" stroke-opacity="0.6" stroke-width="2.5"/>
    <line x1="94" y1="256" x2="104" y2="256" stroke-opacity="0.6" stroke-width="2.5"/>
    <line x1="408" y1="256" x2="418" y2="256" stroke-opacity="0.6" stroke-width="2.5"/>

    <!-- 45-deg angled tick marks -->
    <line x1="142" y1="142" x2="149" y2="149" stroke-opacity="0.4"/>
    <line x1="370" y1="142" x2="363" y2="149" stroke-opacity="0.4"/>
    <line x1="142" y1="370" x2="149" y2="363" stroke-opacity="0.4"/>
    <line x1="370" y1="370" x2="363" y2="363" stroke-opacity="0.4"/>
  </g>

  <!-- Geometric Crypto Shield -->
  <g filter="url(#intenseGlow)">
    <!-- Outer Shield Stroke Path -->
    <path d="M 256 128
             C 310 128, 356 142, 368 152
             C 368 244, 340 316, 256 364
             C 172 316, 144 244, 144 152
             C 156 142, 202 128, 256 128 Z"
          fill="none"
          stroke="url(#shieldGrad)"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Inner Floating Shield Glass Surface -->
    <path d="M 256 140
             C 300 140, 342 152, 354 160
             C 354 238, 330 302, 256 346
             C 182 302, 158 238, 158 160
             C 170 152, 212 140, 256 140 Z"
          fill="#060810"
          fill-opacity="0.55"
          stroke="url(#cyanElectric)"
          stroke-width="1.5"
          stroke-opacity="0.4"/>
  </g>

  <!-- Master Cipher Lock Assembly (Liquid Glass & Refined Metallic Shackle) -->
  <g filter="url(#softGlow)">
    <!-- Lock Shackle Arch -->
    <path d="M 216 230
             L 216 198
             C 216 174, 234 156, 256 156
             C 278 156, 296 174, 296 198
             L 296 230"
          fill="none"
          stroke="url(#shieldGrad)"
          stroke-width="10"
          stroke-linecap="round"/>

    <!-- Lock Solid Body (iOS 27 Glassmorphic Tablet) -->
    <rect x="202" y="222" width="108" height="88" rx="22" ry="22"
          fill="#0d111a"
          stroke="url(#cyanElectric)"
          stroke-width="2.5"/>

    <!-- Central Glowing Biometric Node / Keyhole Core -->
    <circle cx="256" cy="254" r="13" fill="url(#coreGlowGrad)"/>
    <path d="M 253 258 L 251 282 C 251 284, 253 286, 256 286 C 259 286, 261 284, 261 282 L 259 258 Z" fill="url(#coreGlowGrad)"/>
    <circle cx="256" cy="254" r="5" fill="#ffffff"/>
  </g>

  <!-- Orbital Luminous Satellites / Cryptographic Micro-Nodes -->
  <circle cx="256" cy="99" r="4" fill="#ffffff" filter="url(#intenseGlow)"/>
  <circle cx="364" cy="149" r="3.5" fill="#38bdf8" filter="url(#intenseGlow)"/>
  <circle cx="148" cy="149" r="3.5" fill="#38bdf8" filter="url(#intenseGlow)"/>
  <circle cx="256" cy="364" r="4" fill="#60a5fa" filter="url(#intenseGlow)"/>

  <!-- Top Edge Refined Specular Light Line (Apple VisionOS Touch) -->
  <line x1="160" y1="34" x2="352" y2="34" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
</svg>
